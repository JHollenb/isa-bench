[project]
name = "isa-bench"
version = "0.1.0"
description = "Pipeline that runs compiled C programs on every learned x86 executor, measures correctness and compute, and registers the results."
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Everything heavy (torch, unicorn, mlflow, dvc) comes from the shared `common` env on the
# laptop and from the mrun env (+ --with unicorn/psutil) on Beast; see README.md.
mlops = ["mlflow>=2.9", "dvc[s3]>=3.0", "boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
isa-bench = "isa_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isa_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["models/_vendor", "models/*/src", "legacy"]
